<meta charset="utf-8">
<title>Substation Risk Simulator</title>
<meta name="author" content="Ayman Khayat">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root {
  color-scheme: light;
  --ground: #EDF0EB;
  --surface: #F9FAF7;
  --rail: #E4E8E1;
  --line: #D3D9D0;
  --line-strong: #B4BDB1;
  --ink-1: #151A16;
  --ink-2: #48514A;
  --ink-muted: #78827A;
  --accent: #B4621A;
  --accent-ink: #8C480E;
  --accent-soft: rgba(180, 98, 26, 0.12);
  --focus: #B4621A;
  --chart-surface: #F9FAF7;
  --chart-grid: #E2E6DF;
  --chart-axis: #B4BDB1;
  --series-1: #2a78d6;
  --series-1-soft: rgba(42, 120, 214, 0.14);
  --tor-low: #2a78d6;
  --tor-high: #e34948;
  --marker: #39413B;
  --crit-high-bg: rgba(180, 98, 26, 0.14);
  --crit-high-ink: #8C480E;
  --crit-low-bg: rgba(72, 81, 74, 0.09);
  --crit-low-ink: #48514A;
  --font-display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground: #121517;
    --surface: #1A1E20;
    --rail: #16191B;
    --line: #2A3033;
    --line-strong: #3B4347;
    --ink-1: #ECF0EA;
    --ink-2: #B3BBB4;
    --ink-muted: #858E87;
    --accent: #E08A3C;
    --accent-ink: #EBA262;
    --accent-soft: rgba(224, 138, 60, 0.16);
    --focus: #E08A3C;
    --chart-surface: #1A1E20;
    --chart-grid: #262B2E;
    --chart-axis: #3B4347;
    --series-1: #3987e5;
    --series-1-soft: rgba(57, 135, 229, 0.22);
    --tor-low: #3987e5;
    --tor-high: #e66767;
    --marker: #C8CFC9;
    --crit-high-bg: rgba(224, 138, 60, 0.18);
    --crit-high-ink: #EBA262;
    --crit-low-bg: rgba(179, 187, 180, 0.10);
    --crit-low-ink: #B3BBB4;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #121517;
  --surface: #1A1E20;
  --rail: #16191B;
  --line: #2A3033;
  --line-strong: #3B4347;
  --ink-1: #ECF0EA;
  --ink-2: #B3BBB4;
  --ink-muted: #858E87;
  --accent: #E08A3C;
  --accent-ink: #EBA262;
  --accent-soft: rgba(224, 138, 60, 0.16);
  --focus: #E08A3C;
  --chart-surface: #1A1E20;
  --chart-grid: #262B2E;
  --chart-axis: #3B4347;
  --series-1: #3987e5;
  --series-1-soft: rgba(57, 135, 229, 0.22);
  --tor-low: #3987e5;
  --tor-high: #e66767;
  --marker: #C8CFC9;
  --crit-high-bg: rgba(224, 138, 60, 0.18);
  --crit-high-ink: #EBA262;
  --crit-low-bg: rgba(179, 187, 180, 0.10);
  --crit-low-ink: #B3BBB4;
}

*, *::before, *::after { box-sizing: border-box; }
html { background: var(--ground); }
body {
  margin: 0;
  background: var(--ground);
  color: var(--ink-1);
  font: 14px/1.5 var(--font-body);
  -webkit-font-smoothing: antialiased;
}
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.boot { margin: 0; padding: 48px 32px; font: 13px var(--font-mono); color: var(--ink-muted); }

.app { max-width: 1520px; margin: 0 auto; }

.masthead {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 20px 40px;
  align-items: end;
  padding: 28px 32px 22px;
  border-bottom: 1px solid var(--line);
}
.eyebrow {
  margin: 0 0 8px;
  font: 600 11px/1.2 var(--font-display);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--accent-ink);
}
.masthead h1 {
  margin: 0;
  font: 600 34px/1.08 var(--font-display);
  letter-spacing: -0.01em;
  text-wrap: balance;
}
.mast-sub { margin: 6px 0 0; font-size: 14px; color: var(--ink-2); }

.titleblock {
  display: grid;
  grid-template-columns: repeat(4, minmax(96px, auto)) minmax(150px, auto);
  margin: 0;
  border: 1px solid var(--line-strong);
  background: var(--surface);
}
.titleblock > div { padding: 6px 12px 7px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.titleblock > div:nth-child(n + 5) { border-bottom: 0; }
.titleblock > .tb-sign {
  grid-column: 5;
  grid-row: 1 / span 2;
  display: grid;
  align-content: center;
  gap: 3px;
  padding: 8px 16px 9px;
  border-right: 0;
  background: var(--accent-soft);
}
.titleblock .tb-sign-name { margin: 0; font: 600 18px/1.1 var(--font-display); color: var(--ink-1); }
.titleblock .tb-sign-link { margin: 0; }
.titleblock .tb-sign-link a { font: 500 11px var(--font-mono); color: var(--accent-ink); text-decoration: none; }
.titleblock .tb-sign-link a:hover { text-decoration: underline; text-underline-offset: 3px; }
.titleblock dt {
  font: 600 9.5px/1.2 var(--font-display);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-muted);
}
.titleblock dd {
  margin: 2px 0 0;
  font: 500 12.5px/1.3 var(--font-mono);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.titleblock .is-stale { color: var(--accent-ink); }

.layout { display: grid; grid-template-columns: 372px minmax(0, 1fr); align-items: start; }

.rail {
  position: sticky;
  top: 0;
  max-height: 100vh;
  overflow-y: auto;
  background: var(--rail);
  border-right: 1px solid var(--line);
  padding: 4px 0 32px;
}
.rail-sec { padding: 18px 22px 8px; border-bottom: 1px solid var(--line); }
.rail-sec:last-child { border-bottom: 0; }
.rail-h {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin: 0 0 12px;
  font: 600 12px/1.2 var(--font-display);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-2);
}
.rail-unit { font: 400 11px var(--font-mono); letter-spacing: 0; text-transform: none; color: var(--ink-muted); }

.prow { display: grid; gap: 8px; padding: 12px 0 14px; border-top: 1px dashed var(--line-strong); }
.rail-sec .prow:first-of-type { border-top: 0; padding-top: 0; }
.prow-head { display: flex; align-items: center; gap: 8px; min-width: 0; }
.prow-title { flex: 1 1 auto; min-width: 0; font: 600 14px/1.25 var(--font-display); color: var(--ink-1); }
.prow-id {
  flex: none;
  font: 500 10.5px/1 var(--font-mono);
  color: var(--ink-muted);
  padding: 3px 5px;
  border: 1px solid var(--line-strong);
  border-radius: 3px;
}
.prow-meta { font-size: 12px; color: var(--ink-muted); }
.chip {
  flex: none;
  display: inline-flex;
  align-items: center;
  font: 500 10.5px/1 var(--font-mono);
  padding: 4px 7px;
  border-radius: 999px;
  white-space: nowrap;
}
.chip-crit-high { background: var(--crit-high-bg); color: var(--crit-high-ink); }
.chip-crit-low { background: var(--crit-low-bg); color: var(--crit-low-ink); }

.tp { display: grid; gap: 1px; }
.tp-caption {
  font: 600 10.5px/1.2 var(--font-display);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-muted);
  margin-bottom: 2px;
}
.tp-line { display: grid; grid-template-columns: 14px minmax(0, 1fr) 86px; align-items: center; gap: 10px; }
.tp-entry { display: flex; align-items: baseline; justify-content: flex-end; gap: 3px; }
.tp-num {
  width: 60px;
  padding: 3px 4px;
  font: 500 12px/1 var(--font-mono);
  font-variant-numeric: tabular-nums;
  text-align: right;
  color: var(--ink-1);
  background: transparent;
  border: 1px solid transparent;
  border-radius: 3px;
}
.tp-num:hover { border-color: var(--line-strong); }
.tp-num:focus { outline: none; border-color: var(--accent); background: var(--surface); }
.tp-unit { font: 500 10.5px var(--font-mono); color: var(--ink-muted); }

.prow-name {
  flex: 1 1 auto;
  min-width: 0;
  width: 100%;
  margin-left: -5px;
  padding: 2px 4px;
  font: 600 14px/1.25 var(--font-display);
  color: var(--ink-1);
  background: transparent;
  border: 1px solid transparent;
  border-radius: 3px;
}
.prow-name:hover { border-color: var(--line-strong); }
.prow-name:focus { outline: none; border-color: var(--accent); background: var(--surface); }
.icon-btn {
  flex: none;
  display: grid;
  place-items: center;
  width: 22px;
  height: 22px;
  appearance: none;
  border: 1px solid transparent;
  border-radius: 3px;
  background: transparent;
  color: var(--ink-muted);
  font: 500 15px/1 var(--font-body);
  cursor: pointer;
}
.icon-btn:hover { color: var(--tor-high); border-color: var(--line-strong); }
.pred-chips { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.pred-chip {
  appearance: none;
  padding: 4px 6px;
  font: 500 10.5px/1 var(--font-mono);
  color: var(--ink-muted);
  background: transparent;
  border: 1px solid var(--line-strong);
  border-radius: 3px;
  cursor: pointer;
}
.pred-chip:hover:not(:disabled) { border-color: var(--accent); color: var(--ink-1); }
.pred-chip.is-on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-ink); }
.pred-chip:disabled { opacity: 0.35; cursor: not-allowed; }
.btn-add {
  justify-self: start;
  margin: 10px 0 8px;
  background: transparent;
  color: var(--accent-ink);
  border: 1px dashed var(--line-strong);
}
.btn-add:hover { border-color: var(--accent); }

.corr-list { display: grid; gap: 4px; }
.corr-row { display: grid; gap: 6px; padding: 10px 0 12px; border-top: 1px dashed var(--line-strong); }
.corr-row.is-off { opacity: 0.55; }
.corr-select {
  width: 100%;
  min-width: 0;
  padding: 5px 6px;
  font: 500 12px var(--font-body);
  color: var(--ink-1);
  background: var(--surface);
  border: 1px solid var(--line-strong);
  border-radius: 3px;
}
.corr-select:focus { outline: none; border-color: var(--accent); }
.corr-meta { font-size: 11.5px; color: var(--ink-muted); }
.prow-head .corr-meta { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.switch { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 12.5px; color: var(--ink-2); cursor: pointer; }
.switch input { width: 15px; height: 15px; margin: 0; accent-color: var(--accent); }

.field { display: grid; gap: 4px; }
.field-label {
  font: 600 10.5px/1.2 var(--font-display);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-muted);
}
.field-input {
  width: 100%;
  min-width: 0;
  padding: 6px 8px;
  font: 500 13px var(--font-body);
  color: var(--ink-1);
  background: var(--surface);
  border: 1px solid var(--line-strong);
  border-radius: 3px;
}
.field-input:focus { outline: none; border-color: var(--accent); }
.net-scroll { overflow-x: auto; }
.tp-label { font: 600 10.5px/1 var(--font-mono); color: var(--ink-muted); cursor: help; }
.tp-value { font: 500 12px/1 var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; color: var(--ink-1); }

.disclosure {
  justify-self: start;
  appearance: none;
  border: 0;
  background: none;
  padding: 2px 0;
  font: 500 12px/1.3 var(--font-body);
  color: var(--accent-ink);
  cursor: pointer;
  text-decoration: underline;
  text-decoration-color: var(--line-strong);
  text-underline-offset: 3px;
}
.disclosure:hover { text-decoration-color: var(--accent); }

input[type=range].panel-range {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 20px;
  margin: 0;
  background: transparent;
  cursor: pointer;
}
.panel-range::-webkit-slider-runnable-track { height: 3px; border-radius: 2px; background: var(--line-strong); }
.panel-range::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 14px;
  height: 14px;
  margin-top: -5.5px;
  border-radius: 50%;
  background: var(--surface);
  border: 2px solid var(--accent);
}
.panel-range::-moz-range-track { height: 3px; border-radius: 2px; background: var(--line-strong); }
.panel-range::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 2px solid var(--accent); }
.panel-range:hover::-webkit-slider-thumb { background: var(--accent); }
.panel-range:hover::-moz-range-thumb { background: var(--accent); }

.ctrl { display: grid; gap: 14px; }
.ctrl-row { display: grid; gap: 6px; }
.control-label {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
  font: 600 11px/1.2 var(--font-display);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-2);
}
.control-label > :last-child:not(:first-child) { font: 500 12px var(--font-mono); letter-spacing: 0; text-transform: none; color: var(--ink-1); }
.ctrl-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.muted { font-size: 12px; color: var(--ink-muted); }

.seg {
  display: inline-grid;
  grid-auto-flow: column;
  grid-auto-columns: 1fr;
  gap: 2px;
  padding: 2px;
  border: 1px solid var(--line-strong);
  border-radius: 4px;
  background: var(--surface);
}
.seg-btn {
  appearance: none;
  border: 0;
  border-radius: 3px;
  padding: 7px 12px;
  background: transparent;
  color: var(--ink-2);
  font: 500 12.5px/1 var(--font-body);
  cursor: pointer;
  white-space: nowrap;
}
.seg-btn:hover { background: var(--accent-soft); color: var(--ink-1); }
.seg-btn.is-on { background: var(--ink-1); color: var(--ground); }
.btn {
  appearance: none;
  padding: 8px 12px;
  border: 1px solid transparent;
  border-radius: 4px;
  font: 500 12.5px/1 var(--font-body);
  cursor: pointer;
}
.btn-secondary { background: var(--surface); color: var(--ink-1); border-color: var(--line-strong); }
.btn-secondary:hover { border-color: var(--accent); color: var(--accent-ink); }

.canvas { display: grid; gap: 40px; padding: 28px 32px 48px; min-width: 0; transition: opacity 120ms ease; }
.canvas.is-stale { opacity: 0.7; }

.verdict { display: grid; gap: 16px; }
.verdict-figures {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  border-top: 2px solid var(--ink-1);
  border-bottom: 1px solid var(--line);
}
.vf { display: grid; gap: 4px; align-content: start; padding: 14px 20px 16px 0; }
.vf + .vf { padding-left: 20px; border-left: 1px solid var(--line); }
.vf-label {
  font: 600 11px/1.2 var(--font-display);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-2);
}
.vf-value { font: 600 36px/1.05 var(--font-display); letter-spacing: -0.01em; color: var(--ink-1); }
.vf-joint .vf-value { color: var(--accent-ink); }
.vf-delta { font-size: 12.5px; color: var(--ink-2); max-width: 34ch; }

.table-wrap { overflow-x: auto; }
.ptable { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.ptable th, .ptable td { padding: 8px 14px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
.ptable th:first-child { padding-left: 0; text-align: left; }
.ptable thead th {
  font: 600 10.5px/1.2 var(--font-display);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-muted);
}
.ptable tbody th { font: 500 13px var(--font-body); color: var(--ink-2); }
.ptable td { font: 500 13px var(--font-mono); color: var(--ink-1); }
.ptable .is-p80 { background: var(--accent-soft); }
.ptable thead .is-p80 { color: var(--accent-ink); }
.verdict-note { margin: 0; font-size: 12.5px; color: var(--ink-muted); max-width: 80ch; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.block { display: grid; gap: 14px; }
.block-head {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px 24px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--line);
}
.block-head h2 { margin: 0; font: 600 20px/1.2 var(--font-display); }
.block-head p { margin: 0; font-size: 13px; color: var(--ink-2); max-width: 62ch; }

.pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.pair-wide { grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); }
.fig {
  margin: 0;
  display: grid;
  gap: 10px;
  align-content: start;
  min-width: 0;
  padding: 14px 16px 12px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 4px;
}
.fig-head { display: flex; align-items: baseline; gap: 10px; }
.fig-num { font: 500 11px var(--font-mono); color: var(--accent-ink); white-space: nowrap; }
.fig-title { font: 600 15px/1.3 var(--font-display); color: var(--ink-1); }
.measure { min-width: 0; }
.fig-note { margin: 0; font-size: 12px; line-height: 1.45; color: var(--ink-muted); }

.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 12px; color: var(--ink-2); }
.swatch { display: inline-block; width: 10px; height: 10px; margin-right: 6px; border-radius: 2px; vertical-align: -1px; }
.swatch-low { background: var(--tor-low); }
.swatch-high { background: var(--tor-high); }

.method { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px 32px; margin: 0; }
.method dt { margin-bottom: 3px; font: 600 13.5px var(--font-display); color: var(--ink-1); }
.method dd { margin: 0; font-size: 13px; color: var(--ink-2); max-width: 62ch; }
.foot {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 6px 24px;
  margin: 0;
  padding-top: 12px;
  border-top: 1px solid var(--line);
  font-size: 12px;
  color: var(--ink-muted);
}
.foot a { color: var(--accent-ink); font-weight: 600; text-underline-offset: 3px; }
@media (max-width: 640px) {
  .titleblock { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .titleblock > .tb-sign { grid-column: 1 / -1; grid-row: 1; border-bottom: 1px solid var(--line); }
  .titleblock > div:nth-child(n + 5) { border-bottom: 1px solid var(--line); }
}

@media (max-width: 1180px) {
  .pair, .pair-wide { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 980px) {
  .masthead, .layout { grid-template-columns: minmax(0, 1fr); }
  .rail { position: static; max-height: none; border-right: 0; border-bottom: 1px solid var(--line); }
  .verdict-figures { grid-template-columns: minmax(0, 1fr); }
  .vf + .vf { padding-left: 0; border-left: 0; border-top: 1px solid var(--line); }
  .canvas { padding: 24px 18px 40px; }
}
@media (prefers-reduced-motion: reduce) {
  .canvas { transition: none; }
}
</style>
