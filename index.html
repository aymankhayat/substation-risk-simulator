<script type="text/babel" data-presets="react">
function HeroClamp(v, lo, hi) {
  if (Number.isNaN(v)) return lo;
  return Math.max(lo, Math.min(hi, v));
}

function HeroKindWord(kind) {
  if (kind === "duration") return "duration";
  if (kind === "fixed") return "fixed cost";
  return "per-day cost";
}

function HeroShortLabel(scenario, key) {
  const opt = scnInputOptions(scenario).find((o) => o.key === key);
  if (!opt) return key;
  const parts = opt.label.split(" · ");
  return parts.length > 1 ? parts.slice(1).join(" · ") : opt.label;
}

function HeroNav({ githubUrl, author }) {
  return (
    <nav className="nav">
      <a className="nav-brand" href="#top">
        <ArtMark size={28} />
        <span>Substation Risk Simulator</span>
      </a>
      <div className="nav-links">
        <a className="nav-link" href="#model">Live model</a>
        <a className="nav-link" href="#method">Method</a>
        <span className="nav-link">by {author}</span>
        <a className="nav-cta" href={githubUrl} target="_blank" rel="noopener noreferrer">GitHub ↗</a>
      </div>
    </nav>
  );
}

function HeroCurve({ points, marker, tooltip, formatX }) {
  const margin = { left: 40, right: 18, top: 14, bottom: 30 };
  const W = 560;
  const H = 210;
  const plotW = W - margin.left - margin.right;
  const plotH = H - margin.top - margin.bottom;
  const baseline = margin.top + plotH;

  if (!points || points.length === 0) {
    return (
      <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", height: "auto", display: "block" }} role="img" aria-label="Chart with no data" />
    );
  }

  const x0 = points[0].x;
  const x1 = points[points.length - 1].x;
  const rawSpan = x1 - x0;
  const span = rawSpan === 0 ? 1 : rawSpan;

  const scaleX = (x) => margin.left + ((x - x0) / span) * plotW;
  const scaleY = (p) => margin.top + (1 - p) * plotH;

  const linePts = points.map((pt) => `${scaleX(pt.x)},${scaleY(pt.p)}`).join(" ");
  const areaPts = `${scaleX(x0)},${baseline} ${linePts} ${scaleX(x1)},${baseline}`;

  const gridRows = [
    { p: 0, label: "0%" },
    { p: 0.5, label: "50%" },
    { p: 1, label: "100%" },
  ];

  const tickCount = 4;
  const xTicks = [];
  for (let i = 0; i < tickCount; i++) {
    const v = x0 + (i / (tickCount - 1)) * rawSpan;
    xTicks.push({ v, x: scaleX(v) });
  }

  let markerNode = null;
  if (marker && Number.isFinite(marker.x) && Number.isFinite(marker.p)) {
    const px = scaleX(marker.x);
    const py = scaleY(marker.p);
    const gap = 10;
    const tipLines = tooltip || [];
    const len = (i) => String(tipLines[i] || "").length;
    const tw = Math.min(plotW, Math.max(150, Math.ceil(24 + Math.max(len(0) * 6.4, len(2) * 6.4, len(1) * 9.2))));
    const th = 58;
    let boxX = px - gap - tw;
    if (boxX < margin.left) boxX = px + gap;
    boxX = HeroClamp(boxX, margin.left, margin.left + plotW - tw);
    let boxY = py - gap - th;
    boxY = HeroClamp(boxY, margin.top, baseline - th);
    const pointerX = HeroClamp(px, boxX + 10, boxX + tw - 10);
    const lines = tooltip || [];

    markerNode = (
      <g>
        <line x1={px} y1={py} x2={px} y2={baseline} stroke="var(--chart-axis)" strokeWidth={1} strokeDasharray="3 3" />
        <g>
          <rect x={boxX} y={boxY} width={tw} height={th} rx={8} style={{ fill: "var(--tip-bg)" }} />
          <polygon
            points={`${pointerX - 6},${boxY + th} ${pointerX + 6},${boxY + th} ${pointerX},${boxY + th + 8}`}
            style={{ fill: "var(--tip-bg)" }}
          />
          <text x={boxX + 12} y={boxY + 18} fontSize={10.5} style={{ fill: "var(--tip-muted)", fontFamily: "var(--font-mono)" }}>
            {lines[0]}
          </text>
          <text x={boxX + 12} y={boxY + 36} fontSize={15} fontWeight={700} style={{ fill: "var(--tip-ink)" }}>
            {lines[1]}
          </text>
          <text x={boxX + 12} y={boxY + 50} fontSize={10.5} style={{ fill: "var(--tip-muted)", fontFamily: "var(--font-mono)" }}>
            {lines[2]}
          </text>
        </g>
        <circle cx={px} cy={py} r={5} style={{ fill: "var(--surface)", stroke: "var(--series-1)", strokeWidth: 2.5 }} />
      </g>
    );
  }

  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", height: "auto", display: "block" }} role="img" aria-label="Cumulative probability curve">
      {gridRows.map((g) => {
        const y = scaleY(g.p);
        return (
          <g key={g.label}>
            <line x1={margin.left} y1={y} x2={margin.left + plotW} y2={y} stroke="var(--chart-grid)" strokeWidth={1} />
            <text x={margin.left - 6} y={y + 3.5} textAnchor="end" fontSize={11} style={{ fill: "var(--ink-muted)", fontFamily: "var(--font-mono)" }}>
              {g.label}
            </text>
          </g>
        );
      })}
      <polygon points={areaPts} style={{ fill: "var(--series-1-soft)" }} />
      <polyline points={linePts} fill="none" style={{ stroke: "var(--series-1)", strokeWidth: 2.5 }} />
      {xTicks.map((t, i) => (
        <text
          key={i}
          x={t.x}
          y={baseline + 20}
          textAnchor={i === 0 ? "start" : i === xTicks.length - 1 ? "end" : "middle"}
          fontSize={10.5}
          style={{ fill: "var(--ink-muted)", fontFamily: "var(--font-mono)" }}
        >
          {formatX(t.v)}
        </text>
      ))}
      {markerNode}
    </svg>
  );
}

function HeroBars({ rows }) {
  const labelW = 190;
  const rightW = 60;
  const W = 560;
  const rowH = 30;
  const H = 30 + (rows ? rows.length : 0) * rowH;
  const plotX0 = labelW;
  const plotW = W - labelW - rightW;

  if (!rows || rows.length === 0) {
    return <svg viewBox={`0 0 ${W} 30`} style={{ width: "100%", height: "auto", display: "block" }} role="img" aria-label="No driver data" />;
  }

  const base = rows[0].base;
  let domainMin = base;
  let domainMax = base;
  for (const row of rows) {
    domainMin = Math.min(domainMin, row.low, row.high);
    domainMax = Math.max(domainMax, row.low, row.high);
  }
  if (domainMax === domainMin) domainMax = domainMin + 1;

  const scaleX = (v) => plotX0 + ((v - domainMin) / (domainMax - domainMin)) * plotW;
  const baseX = scaleX(base);

  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", height: "auto", display: "block" }} role="img" aria-label="Top cost drivers">
      <line x1={baseX} y1={0} x2={baseX} y2={H} stroke="var(--chart-axis)" strokeWidth={1} />
      {rows.map((row, i) => {
        const cy = 30 + i * rowH + 15;
        const label = row.label.length > 26 ? row.label.slice(0, 26) + "…" : row.label;
        const lowX = scaleX(row.low);
        const highX = scaleX(row.high);
        const lowRectX = Math.min(baseX, lowX);
        const lowRectW = Math.abs(lowX - baseX);
        const highRectX = Math.min(baseX, highX);
        const highRectW = Math.abs(highX - baseX);
        const swingX = Math.max(lowX, highX) + 6;
        return (
          <g key={row.key}>
            <text x={8} y={cy + 4} fontSize={12} style={{ fill: "var(--ink-2)" }}>
              {label}
            </text>
            <rect x={lowRectX} y={cy - 6} width={lowRectW} height={12} rx={3} style={{ fill: "var(--tor-low)" }} />
            <rect x={highRectX} y={cy - 6} width={highRectW} height={12} rx={3} style={{ fill: "var(--tor-high)" }} />
            <text x={swingX} y={cy + 4} fontSize={11} style={{ fill: "var(--ink-muted)", fontFamily: "var(--font-mono)" }}>
              {scnFmtMoney(row.swing)}
            </text>
          </g>
        );
      })}
    </svg>
  );
}

function HeroRing({ value }) {
  const v = HeroClamp(Number.isFinite(value) ? value : 0, 0, 1);
  const size = 64;
  const cx = size / 2;
  const cy = size / 2;
  const strokeW = 7;
  const r = (size - strokeW) / 2;
  const circumference = 2 * Math.PI * r;
  const arcLen = v * circumference;

  return (
    <svg viewBox={`0 0 ${size} ${size}`} width={size} height={size} role="img" aria-label="Joint probability ring">
      <circle cx={cx} cy={cy} r={r} style={{ fill: "none", stroke: "var(--line)", strokeWidth: strokeW }} />
      <circle
        cx={cx}
        cy={cy}
        r={r}
        style={{
          fill: "none",
          stroke: "var(--accent)",
          strokeWidth: strokeW,
          strokeLinecap: "round",
          strokeDasharray: `${arcLen} ${Math.max(circumference - arcLen, 0)}`,
        }}
        transform={`rotate(-90 ${cx} ${cy})`}
      />
      <text x={cx} y={cy} textAnchor="middle" dy=".35em" fontSize={14} fontWeight={700} style={{ fill: "var(--ink-1)" }}>
        {scnFmtPct(v)}
      </text>
    </svg>
  );
}

function HeroSection({ r, point, joint, scenario, settings, githubUrl, author }) {
  const [view, setView] = React.useState("cost");
  const panelRef = React.useRef(null);
  const start = scenario.startDate;
  const distLabel = settings.distribution === "pert" ? "Beta-PERT" : "Triangular";
  const corrCount = r.appliedCorrelations ? r.appliedCorrelations.length : 0;

  function onMove(e) {
    if (e.pointerType !== "mouse") return;
    const panel = panelRef.current;
    if (!panel) return;
    const rect = panel.getBoundingClientRect();
    panel.style.setProperty("--mx", `${e.clientX - rect.left}px`);
    panel.style.setProperty("--my", `${e.clientY - rect.top}px`);
  }

  function onLeave() {
    const panel = panelRef.current;
    if (!panel) return;
    panel.style.removeProperty("--mx");
    panel.style.removeProperty("--my");
  }

  React.useEffect(() => {
    const panel = panelRef.current;
    if (!panel || typeof IntersectionObserver === "undefined") return;
    const observer = new IntersectionObserver((entries) => {
      const entry = entries[0];
      if (!entry) return;
      panel.classList.toggle("is-offscreen", !entry.isIntersecting);
    });
    observer.observe(panel);
    return () => observer.disconnect();
  }, []);

  const tabs = [
    { key: "cost", label: "Cost risk" },
    { key: "schedule", label: "Schedule risk" },
    { key: "drivers", label: "Risk drivers" },
  ];
  const frameTabs = [
    { key: "cost", label: "Cost" },
    { key: "schedule", label: "Schedule" },
    { key: "drivers", label: "Drivers" },
  ];

  function renderCostCards() {
    const p80 = r.costStats.p80;
    const top = r.tornadoCost.slice(0, 4);
    return (
      <React.Fragment>
        <div className="sc-card">
          <div className="sc-card-head">
            <h3 className="sc-card-title">Chance of finishing under budget</h3>
            <span className="sc-card-meta">Total cost, US$</span>
          </div>
          <HeroCurve
            points={r.costCdf}
            marker={{ x: p80, p: 0.8 }}
            tooltip={["P80 budget", scnFmtMoney(p80), "Point estimate " + scnFmtMoney(point.cost)]}
            formatX={scnFmtMoneyTick}
          />
        </div>
        <div className="sc-card">
          <div className="sc-card-head">
            <h3 className="sc-card-title">Top cost drivers</h3>
            <span className="sc-card-meta">P10–P90 swing</span>
          </div>
          <ul className="sc-list">
            {top.map((row) => (
              <li className="sc-item" key={row.key}>
                <span className="sc-item-title">{row.label}</span>
                <span className="sc-item-meta">{row.id} · {HeroKindWord(row.kind)}</span>
                <span className="sc-badge">{scnFmtMoney(row.swing)}</span>
              </li>
            ))}
          </ul>
        </div>
      </React.Fragment>
    );
  }

  function renderCostFloat() {
    const p80 = r.costStats.p80;
    const pct = HeroClamp(p80 > 0 ? (point.cost / p80) * 100 : 0, 0, 100);
    return (
      <div className="float-card float-left">
        <p className="float-label">P80 budget</p>
        <p className="float-value">{scnFmtMoney(p80)}</p>
        <div className="float-bar">
          <div className="float-bar-fill" style={{ width: pct + "%" }} />
        </div>
        <p className="float-meta">{scnFmtMoney(p80 - point.cost)} contingency over the {scnFmtMoney(point.cost)} point estimate</p>
      </div>
    );
  }

  function renderScheduleCards() {
    const p80 = r.durationStats.p80;
    const critById = {};
    for (const c of r.criticality) critById[c.id] = c.index;
    const criticalTasks = scenario.tasks.filter((t) => (critById[t.id] || 0) >= 0.5);
    const floatTasks = scenario.tasks.filter((t) => (critById[t.id] || 0) < 0.5);

    function taskItem(t) {
      const idx = critById[t.id] || 0;
      const hot = idx >= 0.5;
      return (
        <li className="sc-item" key={t.id}>
          <span className="sc-item-title">{t.short}</span>
          <span className="sc-item-meta">{t.id} · likely {t.l} d</span>
          <span className={"sc-badge " + (hot ? "sc-badge-crit" : "sc-badge-ok")}>{scnFmtPct(idx)}</span>
        </li>
      );
    }

    return (
      <React.Fragment>
        <div className="sc-card">
          <div className="sc-card-head">
            <h3 className="sc-card-title">Chance of energising by a date</h3>
            <span className="sc-card-meta">Completion date</span>
          </div>
          <HeroCurve
            points={r.durationCdf}
            marker={{ x: p80, p: 0.8 }}
            tooltip={["P80 energisation", scnFmtDate(start, p80), "Point estimate " + scnFmtDate(start, point.duration)]}
            formatX={(x) => scnFmtDateTick(start, x)}
          />
        </div>
        <div className="sc-card">
          <div className="sc-card-head">
            <h3 className="sc-card-title">Activities</h3>
            <span className="sc-card-meta">share of runs on the critical path</span>
          </div>
          {criticalTasks.length > 0 ? (
            <React.Fragment>
              <p className="sc-col-head"><span className="sc-dot sc-dot-crit"></span>On the critical path</p>
              <ul className="sc-list">{criticalTasks.map(taskItem)}</ul>
            </React.Fragment>
          ) : null}
          {floatTasks.length > 0 ? (
            <React.Fragment>
              <p className="sc-col-head"><span className="sc-dot sc-dot-ok"></span>Has float</p>
              <ul className="sc-list">{floatTasks.map(taskItem)}</ul>
            </React.Fragment>
          ) : null}
        </div>
      </React.Fragment>
    );
  }

  function renderScheduleFloat() {
    const p80 = r.durationStats.p80;
    const pct = HeroClamp(p80 > 0 ? (point.duration / p80) * 100 : 0, 0, 100);
    return (
      <div className="float-card float-left">
        <p className="float-label">P80 energisation</p>
        <p className="float-value">{scnFmtDate(start, p80)}</p>
        <div className="float-bar">
          <div className="float-bar-fill" style={{ width: pct + "%" }} />
        </div>
        <p className="float-meta">{scnFmtDays(p80 - point.duration)} of schedule contingency</p>
      </div>
    );
  }

  function renderDriversCards() {
    const applied = r.appliedCorrelations || [];
    return (
      <React.Fragment>
        <div className="sc-card">
          <div className="sc-card-head">
            <h3 className="sc-card-title">What moves total cost</h3>
            <span className="sc-card-meta">one input at a time, P10 → P90</span>
          </div>
          <HeroBars rows={r.tornadoCost.slice(0, 5)} />
        </div>
        <div className="sc-card">
          <div className="sc-card-head">
            <h3 className="sc-card-title">Linked estimates</h3>
            <span className="sc-card-meta">Iman–Conover rank correlation</span>
          </div>
          {applied.length > 0 ? (
            <ul className="sc-list">
              {applied.map((c) => (
                <li className="sc-item" key={c.id}>
                  <span className="sc-item-title">{HeroShortLabel(scenario, c.a)} ↔ {HeroShortLabel(scenario, c.b)}</span>
                  <span className="sc-item-meta">target {scnFmtRho(c.target)}</span>
                  <span className="sc-badge">achieved {scnFmtRho(c.achieved)}</span>
                </li>
              ))}
            </ul>
          ) : (
            <p className="sc-empty">Correlations are switched off — every input is sampled independently.</p>
          )}
        </div>
      </React.Fragment>
    );
  }

  function renderDriversFloat() {
    return (
      <div className="float-card float-left">
        <p className="float-label">Both P80 targets met</p>
        <p className="float-value">{scnFmtPct(joint)}</p>
        <HeroRing value={joint} />
        <p className="float-meta">of runs finish under the P80 budget and by the P80 date together</p>
      </div>
    );
  }

  let cards = null;
  let floatCard = null;
  if (view === "cost") {
    cards = renderCostCards();
    floatCard = renderCostFloat();
  } else if (view === "schedule") {
    cards = renderScheduleCards();
    floatCard = renderScheduleFloat();
  } else {
    cards = renderDriversCards();
    floatCard = renderDriversFloat();
  }

  return (
    <header className="hero" id="top">
      <div className="hero-panel" ref={panelRef} onPointerMove={onMove} onPointerLeave={onLeave}>
        <div className="hero-light" aria-hidden="true"></div>
        <div className="hero-rings" aria-hidden="true">
          <span className="ring ring-1"></span>
          <span className="ring ring-2"></span>
          <span className="ring ring-3"></span>
        </div>
        <div className="grain" aria-hidden="true"></div>
        <HeroNav githubUrl={githubUrl} author={author} />
        <p className="hero-badge">
          <span className="hero-badge-dot"></span>
          Live Monte Carlo model · 132 kV substation
        </p>
        <h1 className="hero-title">Know the <span className="grad">real</span> finish date<br /> and budget before you commit.</h1>
        <p className="hero-sub">
          10,000 simulated futures of a substation upgrade. Move any estimate and watch the risk move with it.
        </p>
        <div className="hero-actions">
          <a className="btn-glow" href="#model"><span className="btn-glow-inner">Try the live model</span></a>
          <a className="btn-ghost" href={githubUrl} target="_blank" rel="noopener noreferrer">View the code</a>
        </div>

        <div className="pill-switch" role="tablist" aria-label="Showcase view">
          {tabs.map((t) => (
            <button
              key={t.key}
              type="button"
              role="tab"
              aria-selected={view === t.key}
              className={"pill-tab" + (view === t.key ? " is-on" : "")}
              onClick={() => setView(t.key)}
            >
              {t.label}
            </button>
          ))}
        </div>

        <div className="showcase">
          <ArtSkyline className="showcase-art" />
          <div className="frame">
            <div className="frame-rail" aria-hidden="true">
              <span className="frame-rail-btn is-on"><ArtIcon name="grid" size={18} /></span>
              <span className="frame-rail-btn"><ArtIcon name="coin" size={18} /></span>
              <span className="frame-rail-btn"><ArtIcon name="calendar" size={18} /></span>
              <span className="frame-rail-btn"><ArtIcon name="bolt" size={18} /></span>
            </div>
            <div className="frame-main">
              <div className="frame-head">
                <h2 className="frame-title">{scenario.name}</h2>
                <div className="frame-chips">
                  <span className="frame-chip">{distLabel}</span>
                  <span className="frame-chip">{r.n.toLocaleString("en-US")} runs</span>
                  <span className="frame-chip">{corrCount > 0 ? `${corrCount} correlations` : "Independent inputs"}</span>
                </div>
              </div>
              <div className="frame-tabs" role="tablist">
                {frameTabs.map((t) => (
                  <button
                    key={t.key}
                    type="button"
                    role="tab"
                    aria-selected={view === t.key}
                    className={"frame-tab" + (view === t.key ? " is-on" : "")}
                    onClick={() => setView(t.key)}
                  >
                    {t.label}
                  </button>
                ))}
              </div>
              <div className="frame-grid">{cards}</div>
            </div>
          </div>
          {floatCard}
        </div>
      </div>
    </header>
  );
}

function SiteReveal() {
  React.useEffect(() => {
    const elements = Array.from(document.querySelectorAll(".reveal"));

    const reduceMotion =
      typeof window.matchMedia === "function" &&
      window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    if (reduceMotion || typeof IntersectionObserver === "undefined") {
      elements.forEach((el) => el.classList.add("is-in"));
      return;
    }

    const observer = new IntersectionObserver(
      (entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            entry.target.classList.add("is-in");
            observer.unobserve(entry.target);
          }
        });
      },
      { rootMargin: "0px 0px -8% 0px", threshold: 0.12 }
    );

    elements.forEach((el) => observer.observe(el));

    return () => observer.disconnect();
  }, []);

  return null;
}

function AppLikelyOverrides(model) {

function AppJointP80(r) {
  const cp = r.costStats.p80;
  const dp = r.durationStats.p80;
  let hit = 0;
  for (let i = 0; i < r.n; i++) {
    if (r.cost[i] <= cp && r.duration[i] <= dp) hit++;
  }
  return hit / r.n;
}

function AppMarkers(stats) {

}

function AppSigned(v, fmt) {

function AppWrapLabel(text, max) {
  if (text.length <= max) return [text];
  const mid = text.length / 2;
  let best = -1;
  for (let i = 0; i < text.length; i++) {
    if (text[i] === " " && (best < 0 || Math.abs(i - mid) < Math.abs(best - mid))) best = i;
  }
  return best < 0 ? [text] : [text.slice(0, best), text.slice(best + 1)];
}

function AppNetwork({ tasks, crit, width }) {
  const nodeH = 60;
  const pad = 12;
  const gapX = 22;
  const gapY = 20;
  const order = engTopoOrder(tasks);
  const byId = Object.fromEntries(tasks.map((t) => [t.id, t]));
  const level = {};
  for (const id of order) {
    const preds = byId[id].preds;
    level[id] = preds.length ? Math.max(...preds.map((p) => level[p])) + 1 : 0;
  }
  const depth = Math.max(...order.map((id) => level[id])) + 1;
  const cols = Array.from({ length: depth }, () => []);
  for (const id of order) cols[level[id]].push(id);
  const W = Math.max(width, 320, depth * 104 + (depth - 1) * gapX + 2 * pad);
  const maxStack = Math.max(...cols.map((c) => c.length));
  const H = Math.max(196, maxStack * (nodeH + gapY) - gapY + 48);
  const nodeW = Math.min(176, (W - 2 * pad - (depth - 1) * gapX) / depth);
  const maxChars = Math.max(8, Math.floor((nodeW - 18) / 6.4));
  const stepX = depth > 1 ? (W - 2 * pad - nodeW) / (depth - 1) : 0;
  const pos = {};
  cols.forEach((ids, li) =>
    ids.forEach((id, i) => {
      pos[id] = { x: pad + li * stepX, y: (H - nodeH) / 2 + (i - (ids.length - 1) / 2) * (nodeH + gapY) };
    })
  );
  const edges = [];
  for (const t of tasks) {
    for (const p of t.preds) edges.push({ key: p + "-" + t.id, from: p, to: t.id, w: Math.min(crit[p] ?? 0, crit[t.id] ?? 0) });
  }
  edges.sort((a, b) => a.w - b.w);
  const scrolls = W > width;

  return (
    <div className="net-scroll">
      <svg
        viewBox={`0 0 ${W} ${H}`}
        style={{ width: scrolls ? W + "px" : "100%", height: "auto", display: "block" }}
        role="img"
        aria-label="Activity network with the critical path highlighted"
      >
        {edges.map((e) => {
          const a = pos[e.from];
          const b = pos[e.to];
          const sx = a.x + nodeW;
          const sy = a.y + nodeH / 2;
          const tx = b.x;
          const ty = b.y + nodeH / 2;
          const mx = (sx + tx) / 2;
          const hot = e.w >= 0.5;
          return (
            <path
              key={e.key}
              d={`M${sx},${sy} H${mx} V${ty} H${tx}`}
              fill="none"
              strokeLinejoin="round"
              strokeDasharray={hot ? undefined : "4 3"}
              style={{ stroke: hot ? "var(--crit)" : "var(--chart-axis)", strokeWidth: hot ? 1.5 + 2.5 * e.w : 1.25 }}
            />
          );
        })}
        {order.map((id) => {
          const t = byId[id];
          const p = pos[id];
          const c = crit[id] ?? 0;
          const hot = c >= 0.5;
          const lines = AppWrapLabel(t.short, maxChars);
          return (
            <g key={id}>
              <rect
                x={p.x}
                y={p.y}
                width={nodeW}
                height={nodeH}
                rx={3}
                style={{ fill: "var(--surface)", stroke: hot ? "var(--crit)" : "var(--line-strong)", strokeWidth: hot ? 2 : 1 }}
              />
              <text x={p.x + 10} y={p.y + 16} fontSize={10.5} style={{ ...AppMono, fill: "var(--ink-muted)" }}>{id}</text>
              <text x={p.x + nodeW - 10} y={p.y + 16} fontSize={10.5} textAnchor="end" style={{ ...AppMono, fill: hot ? "var(--crit-ink)" : "var(--ink-muted)" }}>
                {scnFmtPct(c)}
              </text>
              {lines.map((ln, i) => (
                <text key={i} x={p.x + 10} y={p.y + (lines.length === 1 ? 41 : 34 + i * 15)} fontSize={12.5} style={{ ...AppDisplay, fill: "var(--ink-1)" }}>
                  {ln}
                </text>
              ))}
            </g>
          );
        })}
      </svg>
    </div>
  );
}

                rangeFixed={AppRangeMoney}
                rangePerDay={AppRangeRate}
                unitMoney={AppUnitMoney}
                unitRate={AppUnitRate}
                formatMoney={scnFmtMoney}
                formatRate={scnFmtRate}
              />
            ))}
            <button type="button" className="btn btn-add" onClick={addCost}>+ Add cost line</button>
          </section>
          <section className="rail-sec">
            <h2 className="rail-h">Correlations <span className="rail-unit">rank ρ</span></h2>
            <PanelCorrelations
              correlations={scenario.correlations}
              options={inputOptions}
              achieved={achieved}
              enabled={settings.correlate}
              onToggle={(v) => setSettings((s) => ({ ...s, correlate: v }))}
              onChange={updateCorrelation}
              onRemove={removeCorrelation}
              onAdd={addCorrelation}
              formatRho={scnFmtRho}
            />
          </section>
        </aside>

        <main className={"canvas" + (stale ? " is-stale" : "")}>
          <AppVerdict r={r} point={point} start={start} />

          <section className="block">
            <header className="block-head">
              <h2 id="total-cost">Total cost</h2>
              <p>Includes per-day costs, so a late project is also an expensive one.</p>
            </header>
            <div className="pair">
              <AppFigure num={1} title="Distribution of total cost">
                <AppMeasure>{(w) => <ChartDistribution width={w} hist={r.costHist} markers={costMarkers} formatX={scnFmtMoneyTick} xTitle="TOTAL COST (US$)" height={230} />}</AppMeasure>
              </AppFigure>
              <AppFigure num={2} title="Chance of finishing at or under a budget">
                <AppMeasure>{(w) => <ChartSCurve width={w} points={r.costCdf} markers={costMarkers} formatX={scnFmtMoneyTick} xTitle="TOTAL COST (US$)" height={230} />}</AppMeasure>
              </AppFigure>
            </div>
          </section>

          <section className="block">
            <header className="block-head">
              <h2>Completion</h2>
              <p>For the default scenario, completion is the day the new transformer is energised and handed over.</p>
            </header>
            <div className="pair">
              <AppFigure num={3} title="Distribution of completion date">
                <AppMeasure>{(w) => <ChartDistribution width={w} hist={r.durationHist} markers={durMarkers} formatX={fmtDateTick} xTitle="COMPLETION DATE" height={230} />}</AppMeasure>
              </AppFigure>
              <AppFigure num={4} title="Chance of completing by a date">
                <AppMeasure>{(w) => <ChartSCurve width={w} points={r.durationCdf} markers={durMarkers} formatX={fmtDateTick} xTitle="COMPLETION DATE" height={230} />}</AppMeasure>
              </AppFigure>
            </div>
          </section>

          <section className="block">
            <header className="block-head">
              <h2 id="risk-drivers">Risk drivers</h2>
              <div className="seg" role="group" aria-label="Sensitivity method">
                <button type="button" className={"seg-btn" + (tornadoMode === "swing" ? " is-on" : "")} aria-pressed={tornadoMode === "swing"} onClick={() => setTornadoMode("swing")}>
                  Swing P10–P90
                </button>
                <button type="button" className={"seg-btn" + (tornadoMode === "corr" ? " is-on" : "")} aria-pressed={tornadoMode === "corr"} onClick={() => setTornadoMode("corr")}>
                  Rank correlation
                </button>
              </div>
            </header>
            {tornadoMode === "swing" ? (
              <div className="legend">
                <span><i className="swatch swatch-low"></i>Input at its own P10</span>
                <span><i className="swatch swatch-high"></i>Input at its own P90</span>
                <span className="muted">one input at a time, every other input at its mean</span>
              </div>
            ) : (
              <div className="legend">
                <span><i className="swatch swatch-high"></i>Higher input, higher result</span>
                <span><i className="swatch swatch-low"></i>Higher input, lower result</span>
                <span className="muted">all inputs varying at once, correlations included</span>
              </div>
            )}
            <div className="pair">
              <AppFigure num={5} title="What moves total cost" note="Activity durations appear here because site overhead and price escalation are charged per day.">
                <AppMeasure>{(w) => <ChartTornado width={w} rows={r.tornadoCost} base={r.base.cost} mode={tornadoMode} formatX={scnFmtMoney} xTitle="TOTAL COST (US$)" maxRows={8} />}</AppMeasure>
              </AppFigure>
              <AppFigure num={6} title="What moves completion" note="An activity with plenty of float barely moves the finish, however uncertain it is.">
                <AppMeasure>{(w) => <ChartTornado width={w} rows={r.tornadoDuration} base={r.base.duration} mode={tornadoMode} formatX={scnFmtDays} xTitle="PROJECT DURATION (DAYS)" maxRows={Math.min(8, scenario.tasks.length)} />}</AppMeasure>
              </AppFigure>
            </div>
          </section>

          <section className="block">
            <header className="block-head">
              <h2 id="critical-path">Critical path</h2>
              <p>Copper marks the path that governs completion in most runs.</p>
            </header>
            <div className="pair pair-wide">
              <AppFigure num={7} title="Activity network" note="Each figure is the share of runs in which that activity is critical. Solid copper links sit on the critical path in at least half of all runs; dashed links carry float.">
                <AppMeasure>{(w) => <AppNetwork width={w} tasks={scenario.tasks} crit={crit} />}</AppMeasure>
              </AppFigure>
              <AppFigure num={8} title="Criticality index" note="Share of runs in which each activity had zero float.">
                <AppMeasure>{(w) => <ChartCriticality width={w} items={r.criticality} formatPct={scnFmtPct} />}</AppMeasure>
              </AppFigure>
            </div>
          </section>

          <section className="block">
            <header className="block-head">
              <h2 id="method">How the numbers are made</h2>
            </header>
            <dl className="method">
              <div>
                <dt>Estimates</dt>
                <dd>Every activity and cost is a three-point range. Beta-PERT weights the most-likely value four times as heavily as the extremes; Triangular gives the tails more weight and is the more cautious choice.</dd>
              </div>
              <div>
                <dt>Schedule</dt>
                <dd>Each run samples every duration and re-solves the network: an activity starts when its last predecessor finishes. The critical path can change from run to run, which Fig. 8 counts.</dd>
              </div>
              <div>
                <dt>Cost</dt>
                <dd>Total cost is the fixed costs plus each per-day rate multiplied by that run's project duration. This is how schedule risk becomes cost risk.</dd>
              </div>
              <div>
                <dt>Correlation</dt>
                <dd>Linked inputs are paired with the Iman–Conover method: sampled values are reordered so each pair's rank correlation matches its target, while every input keeps its own distribution. The achieved value is shown beside each pair.</dd>
              </div>
              <div>
                <dt>Drivers</dt>
                <dd>Swing moves one input from its own P10 to its P90 with everything else at its mean, so it ignores correlation. Rank correlation shows how closely each input tracks the result with everything varying together, correlations included. Both use the first 10,000 runs.</dd>
              </div>
              <div>
                <dt>Confidence levels</dt>
                <dd>P80 means 80% of runs finished at or under that value. The cost and date P80s are separate statements; the joint figure above is the chance of meeting both.</dd>
              </div>
              <div>
                <dt>Limits</dt>
                <dd>Discrete risk events, such as a failed factory acceptance test on the transformer, are not modelled. Durations are calendar days with no working calendar.</dd>
              </div>
            </dl>
            <p className="foot">
              <span>
                Designed and built by{" "}
                <a href={AppAuthor.linkedin} target="_blank" rel="noopener noreferrer">{AppAuthor.name}</a>
              </span>
              <span>Everything runs in your browser. Changes to the estimates stay on this page and are not saved.</span>
            </p>
          </section>
        </main>
      </div>
    </div>
      </section>
      <SiteNotes notes={AppNotes} caseStudyUrl={AppCaseStudy} />
      <SiteCta
        title="Stress-test the substation yourself"
        text="Drag a duration, link two estimates or switch to triangular. The P80 budget and date recalculate in your browser in a fraction of a second."
        primary={{ href: "#model", label: "Open the live model" }}
        secondary={{ href: AppRepo, label: "View the code" }}
      />
      <SiteCredit
        name={AppAuthor.name}
        role="Scoped the problem, chose the modelling approach and verified every number; built with AI-assisted development."
        linkedin={AppAuthor.linkedin}
        github={AppRepo}
      />
      <SiteFooter name={AppAuthor.name} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
